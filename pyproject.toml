[project]
name = "funding-optimizer"
version = "0.1.0"
description = "Predictive analytics for grant allocation and NGO disbursement on Stellar."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "hypothesis>=6,<7",
    "ruff>=0.9,<1",
    "black>=24,<25",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["funding_optimizer*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true
