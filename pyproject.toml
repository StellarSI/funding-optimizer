[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "funding-optimizer"
version = "0.1.0"
description = "Predictive analytics for grant allocation and NGO disbursement on Stellar"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "StellarSI" }]
keywords = ["stellar", "grants", "disbursement", "optimization"]
dependencies = [
  # Persistence layer for optimization runs and plans (P06 / #9).
  "sqlalchemy>=2.0",
]

[project.urls]
Homepage = "https://github.com/StellarSI/funding-optimizer"

[project.scripts]
funding-optimizer = "funding_optimizer.cli:main"

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["funding_optimizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
